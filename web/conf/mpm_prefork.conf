# Prefork MPM limits for small hosts.
# The DNAS load is light (a handful of consoles): few workers are enough,
# and this bounds the worst-case RAM usage.
<IfModule mpm_prefork_module>
	StartServers            1
	MinSpareServers         1
	MaxSpareServers         3
	MaxRequestWorkers       16
	MaxConnectionsPerChild  1000
</IfModule>
