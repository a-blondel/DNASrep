# DNASrep - HTTP VirtualHost (TLS is terminated by stunnel upstream).
# A single VirtualHost serves the region's content; the game requests region
# paths directly (/eu-gw/, /us-gw/, /gai-gw/ ...).
<VirtualHost *:80>
	ServerName gate1.eu.dnas.playstation.org
	ServerAlias gate1.jp.dnas.playstation.org gate1.us.dnas.playstation.org ts01.jp.dnas.playstation.org dnns-p01.jp.dnas.playstation.org dnns-r01.jp.dnas.playstation.org bbn01.jp.dnas.playstation.org bbn02.jp.dnas.playstation.org

	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/dnas

	<Directory />
		Options FollowSymLinks
		AllowOverride None
	</Directory>

	<Directory "/var/www/dnas">
		Options -Indexes
		Require all granted
	</Directory>

	# Force an HTTP/1.0 response to fix error 106 on some installations
	## PS2 LibDNAS-Net User Agent
	BrowserMatch "open sesame asdfjkl" force-response-1.0
	## PS2BBN
	BrowserMatch "SCEI PlayStation BB Navigator 1.0" force-response-1.0

	# The v2.5_* linknames have no .php extension -> explicit PHP handler
	<FilesMatch "v2.5_i-connect">
		SetHandler application/x-httpd-php
	</FilesMatch>
	<FilesMatch "v2.5_others">
		SetHandler application/x-httpd-php
	</FilesMatch>

	ErrorLog ${APACHE_LOG_DIR}/dnas_error.log
	LogLevel warn
	CustomLog ${APACHE_LOG_DIR}/dnas_access.log combined
</VirtualHost>
